<header class="hero hero-fluid hero-page txt-color-sasha-white"
  style="background: linear-gradient(rgba(15,15,30,0.85), rgba(10,10,20,0.9)), url('{% if page.custom-hero-bg %}{{ page.custom-hero-bg }}{% else %}{{ base }}/assets/images/art/hero-default.svg{% endif %}'); background-position: center; background-size: cover;">
  <div class="container nfloat-down">
    <h1>{{ page.heading }}</h1>
    <p class="txt-size-lead">{{ page.sub-heading }}</p>
  </div>
</header>
