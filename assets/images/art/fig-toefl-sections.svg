<defs>
  <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d0f22"/>
    <stop offset="1" stop-color="#264450"/>
  </linearGradient>
  <radialGradient id="bloom" cx="0.5" cy="0.34" r="0.78">
