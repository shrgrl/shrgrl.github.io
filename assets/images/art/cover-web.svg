<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Responsive web application layout">
<title>Responsive web application layout</title>
<defs>
  <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d0f22"/>
    <stop offset="1" stop-color="#383267"/>
  </linearGradient>
  <radialGradient id="bloom" cx="0.5" cy="0.34" r="0.78">
    <stop offset="0" stop-color="#667eea" stop-opacity="0.56"/>
    <stop offset="0.55" stop-color="#9d7bf0" stop-opacity="0.2"/>
    <stop offset="1" stop-color="#667eea" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
    <stop offset="0" stop-color="#000" stop-opacity="0.38"/>
    <stop offset="0.6" stop-color="#000" stop-opacity="0.13"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="edge" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#000" stop-opacity="0.38"/>
    <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="mesh" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(102,126,234,0.14)" stroke-width="1"/>
  </pattern>

</defs>
<rect width="1200" height="900" fill="url(#ground)"/>
